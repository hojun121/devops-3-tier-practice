AWSTemplateFormatVersion: '2010-09-09'
Description: >
  devops-3-tier-practice - 3-Tier infra WITHOUT backend EC2 (no-ec2 edition).
  VPC + NAT x2 + ALB(빈 TargetGroup) + RDS MySQL + S3 + CloudFront/OAC.
  백엔드 EC2 계층만 비워둔 완성형 인프라 - 빈자리는 학생이 콘솔에서
  Launch Template + Auto Scaling Group + CodeDeploy(Blue/Green)로 직접 구성한다.
  NOTE: SG 3개(alb/ec2/rds)는 SG-to-SG 최소 개방 - ALB(80/443) → EC2(8080) → RDS(3306).
  백엔드 EC2는 프라이빗 서브넷(pri-svc) 배치, 아웃바운드는 AZ별 NAT 경유, 접속은 SSM.

# ============================================================ Parameters
Parameters:
  DBUsername:
    Type: String
    Default: admin
    Description: RDS master username
  DBPassword:
    Type: String
    NoEcho: true
    Default: devops123!
    Description: RDS master password (실습 기본값, 운영 금지)
  DBName:
    Type: String
    Default: guestbook
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
  FrontendRawBase:
    Type: String
    Default: https://raw.githubusercontent.com/hojun121/devops-3-tier-practice/main/frontend/
  InitSqlUrl:
    Type: String
    Default: https://raw.githubusercontent.com/hojun121/devops-3-tier-practice/main/backend/init.sql

Resources:
  # ========================================================== VPC / IGW
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 172.16.0.0/23
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-vpc' }]

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: my-igw }]
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  # ========================================================== Subnets (6종 x 2AZ)
  PubElbA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 172.16.0.0/27
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: pub-elb-a }]
  PubElbC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 172.16.0.32/27
      AvailabilityZone: !Select [2, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: pub-elb-c }]
  PubNatA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 172.16.0.64/27
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: pub-nat-a }]
  PubNatC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 172.16.0.96/27
      AvailabilityZone: !Select [2, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: pub-nat-c }]
  PriElbA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 172.16.0.192/27
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: pri-elb-a }]
  PriElbC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 172.16.0.224/27
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags: [{ Key: Name, Value: pri-elb-c }]
  PriSvcA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 172.16.1.0/27
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: pri-svc-a }]
  PriSvcC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 172.16.1.32/27
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags: [{ Key: Name, Value: pri-svc-c }]
  PriDbA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 172.16.1.64/27
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: pri-db-a }]
  PriDbC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 172.16.1.96/27
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags: [{ Key: Name, Value: pri-db-c }]
  PriMgmtA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 172.16.1.128/27
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: pri-mgmt-a }]
  PriMgmtC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 172.16.1.160/27
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags: [{ Key: Name, Value: pri-mgmt-c }]

  # ========================================================== NAT x2 (zonal, AZ별)
  NatEipA:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  NatEipC:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  NatA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PubNatA
      Tags: [{ Key: Name, Value: nat-a }]
  NatC:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipC.AllocationId
      SubnetId: !Ref PubNatC
      Tags: [{ Key: Name, Value: nat-c }]

  # ========================================================== Route Tables
  RtPublic:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: rt-public }]
  RtPublicDefault:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref RtPublic
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw
  RtPrivateA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: rt-private-a }]
  RtPrivateADefault:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RtPrivateA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatA
  RtPrivateC:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: rt-private-c }]
  RtPrivateCDefault:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RtPrivateC
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatC
  RtDb:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: rt-db }]

  # ---- Public associations (pub-elb, pub-nat x2)
  AssocPubElbA: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PubElbA, RouteTableId: !Ref RtPublic } }
  AssocPubElbC: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PubElbC, RouteTableId: !Ref RtPublic } }
  AssocPubNatA: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PubNatA, RouteTableId: !Ref RtPublic } }
  AssocPubNatC: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PubNatC, RouteTableId: !Ref RtPublic } }
  # ---- Private-a associations
  AssocPriElbA:  { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PriElbA,  RouteTableId: !Ref RtPrivateA } }
  AssocPriSvcA:  { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PriSvcA,  RouteTableId: !Ref RtPrivateA } }
  AssocPriMgmtA: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PriMgmtA, RouteTableId: !Ref RtPrivateA } }
  # ---- Private-c associations
  AssocPriElbC:  { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PriElbC,  RouteTableId: !Ref RtPrivateC } }
  AssocPriSvcC:  { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PriSvcC,  RouteTableId: !Ref RtPrivateC } }
  AssocPriMgmtC: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PriMgmtC, RouteTableId: !Ref RtPrivateC } }
  # ---- DB associations
  AssocPriDbA: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PriDbA, RouteTableId: !Ref RtDb } }
  AssocPriDbC: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PriDbC, RouteTableId: !Ref RtDb } }

  # ========================================================== S3 Gateway Endpoint
  # VPC 안 Lambda(DbInit)가 NAT 없이도 S3(cfnresponse presigned URL)에 응답을 보낼 수 있게 함
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref RtPrivateA, !Ref RtPrivateC]

  # ========================================================== Security Groups (SG-to-SG 최소 개방)
  # ALB(80/443) → EC2(8080) → RDS(3306) 체인. 순환 참조 방지를 위해
  # 앞 SG가 뒤 SG를 바라보는 egress는 별도 SecurityGroupEgress 리소스로 분리.
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: alb-sg
      GroupDescription: ALB SG - in 80/443 from anywhere, out 8080 to backend-sg only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80,  ToPort: 80,  CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: alb-sg }]
  AlbSgEgressToEc2:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSg
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !Ref Ec2Sg
  Ec2Sg:
    Type: AWS::EC2::SecurityGroup
    # 학생이 Launch Template 에서 이 SG(backend-sg)를 선택한다.
    # DbInit Lambda 도 이 SG 를 사용한다 (PyPI/S3/RDS 접근).
    Properties:
      GroupName: backend-sg
      GroupDescription: EC2 SG - in 8080 from alb-sg, out 3306 to rds-sg + 80/443 for CD pipeline
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSg }
      SecurityGroupEgress:
        # 80/443 아웃바운드는 CD 파이프라인 필수: userdata(apt/nodesource),
        # CodeDeploy agent 폴링, S3 아티팩트 다운로드, npm ci, Lambda 의 PyPI 접근
        - { IpProtocol: tcp, FromPort: 80,  ToPort: 80,  CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: backend-sg }]
  Ec2SgEgressToRds:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref Ec2Sg
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref RdsSg
  RdsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: rds-sg
      GroupDescription: RDS SG - in 3306 from backend-sg only, no outbound
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3306, ToPort: 3306, SourceSecurityGroupId: !Ref Ec2Sg }
      # egress 를 비우면 CFN 이 기본 all-open 을 남기므로, 루프백 더미 규칙으로 사실상 차단
      SecurityGroupEgress:
        - { IpProtocol: '-1', CidrIp: 127.0.0.1/32 }
      Tags: [{ Key: Name, Value: rds-sg }]

  # ========================================================== RDS MySQL
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub 'guestbook-db-subnet-${AWS::StackName}'
      DBSubnetGroupDescription: pri-db subnets
      SubnetIds: [!Ref PriDbA, !Ref PriDbC]
  RdsInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub 'guestbook-db-${AWS::StackName}'
      Engine: mysql
      EngineVersion: '8.0.42'
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: '20'
      StorageType: gp2
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref RdsSg]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0          # 자동 백업 끔 (최소 구성)
      MonitoringInterval: 0             # 강화 모니터링(Enhanced Monitoring) 끔
      EnablePerformanceInsights: false  # Performance Insights 끔
      Tags: [{ Key: Name, Value: guestbook-db }]

  # ========================================================== DB 스키마 초기화 (Lambda)
  DbInitRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # VPC ENI 생성 + CloudWatch Logs 권한 포함
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
  DbInitFn:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 600
      MemorySize: 256
      Role: !GetAtt DbInitRole.Arn
      VpcConfig:
        SubnetIds: [!Ref PriSvcA, !Ref PriSvcC]   # private: RDS 접근(VPC내) + PyPI(NAT) + S3(endpoint)
        SecurityGroupIds: [!Ref Ec2Sg]
      Code:
        ZipFile: |
          import json, time, urllib.request, sys, io, zipfile

          # cfnresponse 의존 제거: 직접 presigned URL 로 PUT (S3 Gateway Endpoint 경유)
          # 스택 삭제 중 네트워크 경로 철거와 겹치면 일시적 reset 이 날 수 있어 재시도한다
          def send(event, ctx, status, reason=None):
              body = json.dumps({
                  'Status': status,
                  'Reason': (reason or ('see log stream ' + ctx.log_stream_name))[:1000],
                  'PhysicalResourceId': event.get('PhysicalResourceId') or ctx.log_stream_name,
                  'StackId': event['StackId'], 'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'], 'Data': {},
              }).encode()
              for i in range(5):
                  try:
                      req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT',
                          headers={'content-type': '', 'content-length': str(len(body))})
                      urllib.request.urlopen(req, timeout=30)
                      return
                  except Exception as e:
                      print(f'send attempt {i+1} failed:', e)
                      if i == 4:
                          raise
                      time.sleep(10)

          def handler(event, ctx):
              try:
                  if event['RequestType'] == 'Create':
                      p = event['ResourceProperties']
                      # 런타임에 PyPI에서 순수파이썬 pymysql 휠 받아 /tmp 에 설치
                      meta = json.load(urllib.request.urlopen('https://pypi.org/pypi/PyMySQL/json', timeout=30))
                      url = next(u['url'] for u in meta['urls'] if u['filename'].endswith('py3-none-any.whl'))
                      zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(url, timeout=60).read())).extractall('/tmp/deps')
                      sys.path.insert(0, '/tmp/deps')
                      import pymysql
                      from pymysql.constants import CLIENT
                      sql = urllib.request.urlopen(p['InitSqlUrl'], timeout=30).read().decode('utf-8')
                      conn = pymysql.connect(host=p['Host'], user=p['User'], password=p['Password'],
                                             port=3306, connect_timeout=15,
                                             client_flag=CLIENT.MULTI_STATEMENTS)
                      cur = conn.cursor(); cur.execute(sql)
                      while cur.nextset():
                          pass
                      conn.commit(); cur.close(); conn.close()
                  # Update/Delete 는 멱등 위해 no-op
                  send(event, ctx, 'SUCCESS')
              except Exception as e:
                  send(event, ctx, 'FAILED', str(e))
  DbInit:
    Type: AWS::CloudFormation::CustomResource
    # NAT 경로/서브넷 연결이 끝난 뒤 실행되도록 보장 (Lambda 인터넷 접근)
    # S3Endpoint 포함 이유: 삭제 시 DbInit 의 응답(PUT)이 S3 로 나가는 경로가
    # 먼저 철거되면 Connection reset 으로 DELETE_FAILED 가 난다. DependsOn 은
    # 삭제 순서도 보장하므로(역순), DbInit 이 네트워크 경로보다 먼저 삭제된다.
    DependsOn: [RtPrivateADefault, RtPrivateCDefault, AssocPriSvcA, AssocPriSvcC, S3Endpoint]
    Properties:
      ServiceToken: !GetAtt DbInitFn.Arn
      Host: !GetAtt RdsInstance.Endpoint.Address
      User: !Ref DBUsername
      Password: !Ref DBPassword
      DbName: !Ref DBName
      InitSqlUrl: !Ref InitSqlUrl

  # ========================================================== ALB + TG (빈 TargetGroup)
  # 정적 EC2 타겟을 제거했다. 학생의 Auto Scaling Group 이 이 TargetGroup 에 타겟을 등록한다.
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'tg-${AWS::StackName}'
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'alb-${AWS::StackName}'
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups: [!Ref AlbSg]
      Subnets: [!Ref PubElbA, !Ref PubElbC]
  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ========================================================== S3 (Frontend)
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub 'guestbook-frontend-${AWS::AccountId}-${AWS::StackName}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ========================================================== CloudFront
  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: guestbook 3-tier
        DefaultRootObject: index.html
        Origins:
          - Id: s3-frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref Oac
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: alb-origin
            DomainName: !GetAtt Alb.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: s3-frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: alb-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # AllViewer
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        PriceClass: PriceClass_200

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ========================================================== Frontend 자동 업로드 (Lambda CR)
  FrontendUploadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: s3-frontend-rw
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !GetAtt FrontendBucket.Arn
                  - !Sub '${FrontendBucket.Arn}/*'
  FrontendUploadFn:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt FrontendUploadRole.Arn
      Code:
        ZipFile: |
          import json, urllib.request, boto3

          FILES = {'index.html': 'text/html',
                   'app.js': 'application/javascript',
                   'style.css': 'text/css'}

          # cfnresponse 의존 제거: presigned URL 로 직접 PUT (모듈 미첨부 문제 회피)
          def send(event, ctx, status, reason=None):
              body = json.dumps({
                  'Status': status,
                  'Reason': (reason or ('see log stream ' + ctx.log_stream_name))[:1000],
                  'PhysicalResourceId': event.get('PhysicalResourceId') or ctx.log_stream_name,
                  'StackId': event['StackId'], 'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'], 'Data': {},
              }).encode()
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT',
                  headers={'content-type': '', 'content-length': str(len(body))})
              urllib.request.urlopen(req, timeout=30)

          def handler(event, ctx):
              try:
                  s3 = boto3.client('s3')
                  p = event['ResourceProperties']
                  bucket = p['BucketName']; base = p['Base']
                  rt = event['RequestType']
                  if rt in ('Create', 'Update'):
                      for f, ct in FILES.items():
                          data = urllib.request.urlopen(base + f, timeout=30).read()
                          s3.put_object(Bucket=bucket, Key=f, Body=data, ContentType=ct)
                  elif rt == 'Delete':
                      objs = s3.list_objects_v2(Bucket=bucket).get('Contents', [])
                      if objs:
                          s3.delete_objects(Bucket=bucket,
                              Delete={'Objects': [{'Key': o['Key']} for o in objs]})
                  send(event, ctx, 'SUCCESS')
              except Exception as e:
                  send(event, ctx, 'FAILED', str(e))
  FrontendUpload:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt FrontendUploadFn.Arn
      BucketName: !Ref FrontendBucket
      Base: !Ref FrontendRawBase

# ============================================================ Outputs
# 학생이 콘솔에서 Launch Template / ASG / CodeDeploy 를 만들 때 필요한 값들
Outputs:
  CloudFrontURL:
    Description: 최종 접속 URL (HTTPS)
    Value: !Sub 'https://${Distribution.DomainName}'
  AlbDNS:
    Description: ALB DNS (직접 테스트용)
    Value: !Sub 'http://${Alb.DNSName}'
  RdsEndpoint:
    Description: Launch Template userdata 의 .env(DB_HOST) 에 넣을 RDS 주소
    Value: !GetAtt RdsInstance.Endpoint.Address
  FrontendBucketName:
    Value: !Ref FrontendBucket
  VpcId:
    Description: ASG/Launch Template 생성 시 사용할 VPC
    Value: !Ref Vpc
  BackendSubnets:
    Description: ASG 에 지정할 서브넷 (pri-svc-a, pri-svc-c)
    Value: !Sub '${PriSvcA},${PriSvcC}'
  BackendSgId:
    Description: Launch Template 에 지정할 보안그룹 (backend-sg)
    Value: !Ref Ec2Sg
  TargetGroupArn:
    Description: ASG/CodeDeploy 에 연결할 ALB TargetGroup
    Value: !Ref TargetGroup
  TargetGroupName:
    Value: !Sub 'tg-${AWS::StackName}'
